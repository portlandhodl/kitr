[package]
name = "kitty-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "OpenGL renderer, shaders and decorations ported from kitty"

[dependencies]
kitty-core = { path = "../kitty-core" }
kitty-screen = { path = "../kitty-screen" }
kitty-fonts = { path = "../kitty-fonts" }
kitty-graphics = { path = "../kitty-graphics" }

[features]
default = []
# Headless OpenGL/EGL backend (egl.rs, gl_shaders.rs, gl_backend.rs).
gl = []

[[example]]
name = "bench_gl"
required-features = ["gl"]
