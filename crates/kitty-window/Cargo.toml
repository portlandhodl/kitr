[package]
name = "kitty-window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Linux X11/Wayland/EGL window and event backend for kitr"

[dependencies]
kitty-core = { path = "../kitty-core" }
wayland-client = { version = "=0.31.12", optional = true }
wayland-protocols = { version = "=0.32.10", features = ["client", "staging"], optional = true }
wayland-backend = { version = "=0.3.12", features = ["client_system"], optional = true }

[features]
default = []
wayland = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-backend"]
