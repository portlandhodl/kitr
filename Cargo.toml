[workspace]
resolver = "2"
members = ["crates/kitty-core", "crates/kitty-vt", "crates/kitty-simd", "crates/kitty-unicode", "crates/kitty-screen", "crates/kitty-input", "crates/kitty-os"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
repository = "https://github.com/russeree/kitr"
homepage = "https://github.com/russeree/kitr"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
opt-level = 3
